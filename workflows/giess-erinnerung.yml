# Blattwerk – tägliche Gieß-Erinnerung per Push (Firebase Cloud Messaging)
# Läuft jede volle Stunde. Ob gerade die gewählte Uhrzeit eines Nutzers ist,
# prüft das Skript selbst in dessen Zeitzone – so gibt es keine Probleme mit
# Sommer-/Winterzeit.
name: Gieß-Erinnerung

on:
  schedule:
    - cron: '0 * * * *'        # jede volle Stunde (UTC)
  workflow_dispatch:           # manuell starten: GitHub → Actions → Gieß-Erinnerung → Run workflow
    inputs:
      test:
        description: 'Testlauf: Uhrzeit und "heute schon erinnert" ignorieren (sendet sofort, wenn Pflanzen fällig sind)'
        type: boolean
        default: true

# Nie zwei Läufe gleichzeitig (verhindert doppelte Nachrichten)
concurrency:
  group: giess-erinnerung
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  erinnern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Erinnerungen senden
        working-directory: scripts
        env:
          # Service-Account-Schlüssel – liegt NUR als GitHub-Secret vor, nie im Repository
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Optional: eigene Adresse der App (Repository-Variable APP_URL).
          # Leer = automatisch https://<name>.github.io/<repository>/
          APP_URL: ${{ vars.APP_URL }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && 'true' || 'false' }}
        run: node send-reminders.js
